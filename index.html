<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Habit Tracker</title>
  <link rel="stylesheet" href="style.css?v=2.2">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <div class="card">
    <!-- Auth Nézet -->
    <div id="auth-container">
      <div class="header">
        <div style="display: flex; align-items: center; justify-content: center; gap: 8px;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#00e676" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M9 12l2 2 4-4"></path></svg>
          <h1>Habit Tracker</h1>
        </div>
        <div class="date">Üdv újra! Jelentkezz be:</div>
      </div>
      <div class="modal-inputs" style="margin-top: 20px;">
        <input type="email" id="auth-email" placeholder="E-mail cím">
        <input type="password" id="auth-password" placeholder="Jelszó">
      </div>
      <div style="display: flex; gap: 10px; margin-top: 15px;">
        <button class="modal-submit-btn" onclick="App.handleLogin()">Bejelentkezés</button>
        <button class="modal-submit-btn" style="background: var(--text-sub, #666);" onclick="App.handleSignUp()">Regisztráció</button>
      </div>
      <div id="auth-error" style="color: #ff4d4d; font-size: 13px; margin-top: 10px; text-align: center;"></div>
    </div>

    <!-- App Nézet -->
    <div id="app-container" style="display: none;">
      <div class="header">
        <div style="display: flex; align-items: center; justify-content: center; gap: 8px;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#00e676" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="4"></rect><path d="M9 12l2 2 4-4"></path></svg>
          <h1>Habit Tracker</h1>
        </div>
        <div class="date" id="current-date">Mai nap: --.--.----</div>
      </div>

      <!-- Főoldal -->
      <div id="view-home">
        <div class="progress-box">
          <div class="progress-info">
            <span class="progress-title">Napi haladás</span>
            <span class="progress-percentage" id="progress-text">0%</span>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progress-fill"></div>
          </div>
        </div>
        <div class="habit-list" id="habits-container">
          <div class="loader">Betöltés...</div>
        </div>
        <button class="open-modal-btn" onclick="App.openAddModal()"><span>+</span> Új szokás hozzáadása</button>
      </div>

      <!-- Statisztika Nézet -->
      <div id="view-stats" style="display: none;">
        <div class="stats-switcher">
          <button class="stats-tab-btn active" id="btn-stats-weekly" onclick="App.switchStatsTab('weekly')">Utolsó 7 nap</button>
          <button class="stats-tab-btn" id="btn-stats-monthly" onclick="App.switchStatsTab('monthly')">Utolsó 30 nap</button>
        </div>
        <div style="margin-top: 20px; background: rgba(255,255,255,0.03); padding: 15px; border-radius: 12px;">
          <div style="height: 180px; position: relative;"><canvas id="barChart"></canvas></div>
        </div>
        <div style="margin-top: 20px; background: rgba(255,255,255,0.03); padding: 15px; border-radius: 12px;">
          <div style="height: 180px; position: relative;"><canvas id="statsChart"></canvas></div>
        </div>
      </div>

      <!-- Profil Nézet -->
      <div id="view-profile" style="display: none;" class="profile-container">
        <h3>Profil beállítások</h3>
        <p id="user-email-display" style="color: var(--text-sub); font-size: 13px; margin-bottom: 20px;"></p>
        <button class="modal-submit-btn" style="background: #ff4d4d;" onclick="App.logout()">Kijelentkezés</button>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="habit-modal">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title" id="modal-title-text">Új szokás</span>
        <button class="close-modal-btn" onclick="App.closeModal()">✕</button>
      </div>
      <div class="modal-inputs">
        <input type="text" id="habit-name-input" placeholder="Szokás neve">
        <input type="number" id="habit-freq-input" placeholder="Heti cél (pl. 7)">
      </div>
      <button class="modal-submit-btn" onclick="App.saveHabitModal()">Mentés</button>
    </div>
  </div>

  <!-- Bottom Tab Bar -->
  <div class="ios-tab-bar" id="bottom-tab-bar" style="display: none;">
    <button class="tab-item active" onclick="App.switchTab('home')" id="tab-home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
      <span class="tab-label">Főoldal</span>
    </button>
    <button class="tab-item" onclick="App.switchTab('stats')" id="tab-stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
      <span class="tab-label">Statisztika</span>
    </button>
    <button class="tab-item" onclick="App.switchTab('profile')" id="tab-profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      <span class="tab-label">Profil</span>
    </button>
  </div>

  <!-- Moduláris szkriptek beolvasása -->
  <script src="api.js"></script>
  <script src="ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
