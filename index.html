<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Habit Tracker</title>

  <link rel="stylesheet" href="style.css">

  <!-- Supabase JS Client SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Neon zöld ikon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><defs><linearGradient id='neonGradient' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%2300FF00'/><stop offset='15%25' stop-color='%2300FF00'/><stop offset='35%25' stop-color='%23003300'/><stop offset='65%25' stop-color='%23003300'/><stop offset='85%25' stop-color='%2300FF00'/><stop offset='100%25' stop-color='%2300FF00'/></linearGradient></defs><rect width='512' height='512' rx='100' fill='%23000000'/><circle cx='256' cy='256' r='180' stroke='%23333333' stroke-width='40' fill='none'/><circle cx='256' cy='256' r='180' stroke='url(%23neonGradient)' stroke-width='40' stroke-linecap='round' fill='none' stroke-dasharray='1131' stroke-dashoffset='565' transform='rotate(-90 256 256)'/><path d='M 180 256 L 236 312 L 348 200' stroke='%23FFFFFF' stroke-width='40' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>">
</head>
<body>

<div class="card">
  <div class="header">
    <h1>Habit Tracker</h1>
    <div class="date" id="date-display">Dátum betöltése...</div>
    <button class="edit-toggle-btn" onclick="toggleEditMode()" title="Szerkesztés / Törlés">🗑️</button>
  </div>

  <div id="app-box">
    <div class="progress-box" id="progress-box">
      <div class="progress-info">
        <span class="progress-title">Napi haladás</span>
        <span class="progress-percentage" id="progress-text">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-bar"></div>
      </div>
    </div>

    <div id="content">
      <div class="loader">Mai adatok betöltése...</div>
    </div>

    <div id="action-btn-container">
      <button class="open-modal-btn" onclick="openModal()">➕ Új szokás hozzáadása</button>
    </div>

    <button class="details-btn" onclick="toggleAnalytics()">📈 Részletes elemzés / Fejlődési pontok</button>
    <div class="analytics-panel" id="analytics-panel">
      <div id="analytics-content">
        <p style="font-size: 12px; color: var(--text-sub);">Kattints a frissítéshez vagy töltsd be az adatokat.</p>
      </div>
    </div>

    <div id="status"></div>
  </div>
</div>

<!-- Modal az új szokáshoz -->
<div class="modal-overlay" id="habit-modal">
  <div class="modal-content">
    <div class="modal-header">
      <span class="modal-title">➕ Új szokás felvétele</span>
      <button class="close-modal-btn" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-inputs">
      <input type="text" id="new-habit-title" placeholder="Szokás neve (pl. Olvasás)">
      <input type="number" id="new-habit-time" placeholder="Cél idő percben (pl. 15)">
    </div>
    <button class="modal-submit-btn" onclick="addNewHabit()">Hozzáadás</button>
  </div>
</div>

<script>
const SUPABASE_URL = "https://hcnfoywtoegokphjmzpn.supabase.co";
const SUPABASE_KEY = "sb_publishable_Uzsb3AnDYM5bAwKWI5gwwQ_Hb3fwtNH";

const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let habitsList = [];
let todayLogs = {};
let isEditMode = false;
let currentStatsPeriod = 'week';
const todayStr = new Date().toISOString().split('T')[0];

window.onload = function() {
  const now = new Date();
  document.getElementById('date-display').innerText = 'Mai nap: ' +
    String(now.getDate()).padStart(2, '0') + '.' +
    String(now.getMonth() + 1).padStart(2, '0') + '.' +
    now.getFullYear();

  loadData();
};

async function loadData() {
  try {
    const { data: habits, error: habitsErr } = await sbClient
      .from('habits')
      .select('*')
      .eq('is_active', true)
      .order('id', { ascending: true });

    if (habitsErr) throw habitsErr;
    habitsList = habits;

    const { data: logs, error: logsErr } = await sbClient
      .from('daily_logs')
      .select('*')
      .eq('log_date', todayStr);

    if (logsErr) throw logsErr;

    todayLogs = {};
    if (logs) {
      logs.forEach(l => {
        todayLogs[l.habit_id] = l.completed;
      });
    }

    renderHabits();
  } catch (err) {
    console.error("Hiba az adatok betöltésekor:", err);
    document.getElementById('content').innerHTML = '<p style="text-align:center;color:#ef4444;">Hiba az adatok betöltésekor!</p>';
  }
}

function formatTimeLimit(minutes) {
  const num = Number(minutes);
  if (!num || num <= 0) return '';
  if (num >= 60) {
    return `⏱️ ${num / 60} óra`;
  }
  return `⏱️ ${num} perc`;
}

function toggleEditMode() {
  isEditMode = !isEditMode;
  renderHabits();
  
  const container = document.getElementById('action-btn-container');
  if (isEditMode) {
    container.innerHTML = '<button class="done-edit-btn" onclick="toggleEditMode()">Kész (Törlés mód bezárása)</button>';
  } else {
    container.innerHTML = '<button class="open-modal-btn" onclick="openModal()">➕ Új szokás hozzáadása</button>';
  }
}

function renderHabits() {
  if (habitsList.length === 0) {
    document.getElementById('content').innerHTML = '<p style="text-align:center;color:var(--text-sub);">Még nincsenek aktív szokásaid.</p>';
    updateProgress();
    return;
  }

  let html = '<div class="habit-list">';

  habitsList.forEach(h => {
    const isChecked = todayLogs[h.id] === true;
    const timeStr = formatTimeLimit(h.target_minutes);

    html += `
      <div class="habit-item">
        <div class="habit-info">
          <span class="habit-name">${h.title}</span>
          ${timeStr ? `<span class="habit-time">${timeStr}</span>` : ''}
        </div>
        ${isEditMode ? `
          <button class="delete-single-btn" onclick="archiveHabit(${h.id})">Törlés</button>
        ` : `
          <label class="switch">
            <input type="checkbox" id="habit-${h.id}" ${isChecked ? 'checked' : ''} onchange="toggleHabit(${h.id}, this.checked)">
            <span class="slider"></span>
          </label>
        `}
      </div>
    `;
  });

  html += '</div>';
  document.getElementById('content').innerHTML = html;
  updateProgress();
}

function updateProgress() {
  if (habitsList.length === 0) {
    document.getElementById('progress-text').innerText = '0%';
    document.getElementById('progress-bar').style.width = '0%';
    return;
  }

  let checkedCount = 0;
  habitsList.forEach(h => {
    if (todayLogs[h.id] === true) checkedCount++;
  });

  const percent = Math.round((checkedCount / habitsList.length) * 100);
  document.getElementById('progress-text').innerText = percent + '%';
  document.getElementById('progress-bar').style.width = percent + '%';
}

async function toggleHabit(habitId, isCompleted) {
  todayLogs[habitId] = isCompleted;
  updateProgress();

  const statusDiv = document.getElementById('status');
  statusDiv.style.color = 'var(--text-sub)';
  statusDiv.innerText = 'Mentés...';

  const { error } = await sbClient
    .from('daily_logs')
    .upsert({
      habit_id: habitId,
      log_date: todayStr,
      completed: isCompleted
    }, { onConflict: 'habit_id,log_date' });

  if (error) {
    console.error("Mentési hiba:", error);
    statusDiv.style.color = '#ef4444';
    statusDiv.innerText = 'Hiba mentéskor!';
  } else {
    statusDiv.style.color = '#00FF00';
    statusDiv.innerText = '✅ Mentve';
    setTimeout(() => { statusDiv.innerText = ''; }, 1500);
  }
}

function openModal() {
  document.getElementById('habit-modal').classList.add('active');
}

function closeModal() {
  document.getElementById('habit-modal').classList.remove('active');
}

async function addNewHabit() {
  const titleInput = document.getElementById('new-habit-title');
  const timeInput = document.getElementById('new-habit-time');

  const title = titleInput.value.trim();
  const time = parseInt(timeInput.value) || 0;

  if (!title) {
    alert("Kérlek add meg a szokás nevét!");
    return;
  }

  const { error } = await sbClient
    .from('habits')
    .insert([{ title: title, target_minutes: time, is_active: true }]);

  if (error) {
    console.error("Hiba hozzáadáskor:", error);
    alert("Nem sikerült hozzáadni a szokást!");
  } else {
    titleInput.value = '';
    timeInput.value = '';
    closeModal();
    loadData();
  }
}

async function archiveHabit(habitId) {
  if (!confirm("Biztosan törölni akarod ezt a szokást?")) return;

  const { error } = await sbClient
    .from('habits')
    .update({ is_active: false })
    .eq('id', habitId);

  if (error) {
    console.error("Hiba törléskor:", error);
    alert("Nem sikerült törölni a szokást!");
  } else {
    loadData();
  }
}

function toggleAnalytics() {
  const panel = document.getElementById('analytics-panel');
  if (panel.style.display === 'block') {
    panel.style.display = 'none';
  } else {
    panel.style.display = 'block';
    loadAnalytics(currentStatsPeriod);
  }
}

function switchStatsPeriod(period) {
  currentStatsPeriod = period;
  loadAnalytics(period);
}

async function loadAnalytics(period) {
  const container = document.getElementById('analytics-content');
  container.innerHTML = '<div style="text-align:center; padding:10px; font-size:12px; color:var(--text-sub);">Statisztika kiszámítása...</div>';

  const daysCount = period === 'week' ? 7 : 30;
  
  const startDate = new Date();
  startDate.setDate(startDate.getDate() - (daysCount - 1));
  const startDateStr = startDate.toISOString().split('T')[0];

  try {
    const { data: logs, error } = await sbClient
      .from('daily_logs')
      .select('*')
      .gte('log_date', startDateStr);

    if (error) throw error;

    if (!logs || logs.length === 0 || habitsList.length === 0) {
      container.innerHTML = '<p style="font-size:12px; color:var(--text-sub); text-align:center;">Még nincs elég adat az elemzéshez.</p>';
      return;
    }

    const totalPossible = habitsList.length * daysCount;
    const completedLogs = logs.filter(l => l.completed === true).length;
    const totalPercent = Math.round((completedLogs / totalPossible) * 100);

    const habitStats = {};
    habitsList.forEach(h => {
      const hLogs = logs.filter(l => l.habit_id === h.id && l.completed === true);
      const percent = Math.round((hLogs.length / daysCount) * 100);
      habitStats[h.id] = { title: h.title, percent: Math.min(percent, 100), count: hLogs.length };
    });

    let weakestHabit = Object.values(habitStats).sort((a, b) => a.percent - b.percent)[0];

    let html = `
      <div class="stats-switcher">
        <button class="stats-tab-btn ${period === 'week' ? 'active' : ''}" onclick="switchStatsPeriod('week')">📅 Utolsó 7 nap</button>
        <button class="stats-tab-btn ${period === 'month' ? 'active' : ''}" onclick="switchStatsPeriod('month')">🗓️ Utolsó 30 nap</button>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value">${totalPercent}%</div>
          <div class="stat-label">Átlagos teljesítés</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" style="font-size: 13px; font-weight:600; color: #ef4444; margin-top: 3px;">
            ${weakestHabit ? weakestHabit.title : '-'}
          </div>
          <div class="stat-label">Fejlesztendő terület</div>
        </div>
      </div>

      <div class="analytics-title" style="margin-top: 10px;">📊 Szokások aránya:</div>
    `;

    Object.values(habitStats).forEach(st => {
      html += `
        <div class="stat-habit-row">
          <span>${st.title}</span>
          <div>
            <span style="font-weight:600; color: var(--text-main);">${st.percent}%</span>
            <div class="stat-bar-bg">
              <div class="stat-bar-fill" style="width: ${st.percent}%;"></div>
            </div>
          </div>
        </div>
      `;
    });

    container.innerHTML = html;

  } catch (err) {
    console.error("Statisztikai hiba:", err);
    container.innerHTML = '<p style="font-size:12px; color:#ef4444; text-align:center;">Hiba a statisztika betöltésekor.</p>';
  }
}
</script>
</body>
</html>
