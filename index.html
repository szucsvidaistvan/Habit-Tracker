<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Tracker</title>
  <link rel="stylesheet" href="style.css">
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.48.0"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <!-- Bejelentkezési felület (Auth View) -->
  <div id="auth-container" class="card" style="display: none; max-width: 400px; margin: 40px auto; padding: 20px;">
    <h2>Bejelentkezés</h2>
    <div id="auth-error" style="color: #ef4444; margin-bottom: 10px;"></div>
    <input type="email" id="auth-email" placeholder="E-mail cím" style="width: 100%; margin-bottom: 10px; padding: 10px;" />
    <input type="password" id="auth-password" placeholder="Jelszó" style="width: 100%; margin-bottom: 15px; padding: 10px;" />
    <button class="btn-primary" onclick="App.handleLogin()" style="width: 100%; margin-bottom: 10px;">Bejelentkezés</button>
    <button class="btn-secondary" onclick="App.handleSignUp()" style="width: 100%;">Regisztráció</button>
  </div>

  <!-- Fő Alkalmazás (App View) -->
  <div id="app-container" style="display: none;">
    <!-- Home Tab -->
    <div id="view-home" class="tab-content">
      <header class="app-header">
        <h1>Habit Tracker</h1>
        <div id="current-date" class="date-display"></div>
      </header>

      <div class="progress-card card">
        <div class="progress-header">
          <span>Napi haladás</span>
          <span id="progress-text">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div id="progress-fill" class="progress-bar-fill" style="width: 0%;"></div>
        </div>
      </div>

      <div id="habits-container" class="habits-list"></div>

      <button class="btn-primary add-habit-btn" onclick="App.openAddModal()">+ Új szokás hozzáadása</button>
    </div>

    <!-- Stats Tab -->
    <div id="view-stats" class="tab-content" style="display: none;">
      <h2>Statisztikák</h2>
      <div class="stats-toggle">
        <button id="btn-stats-weekly" class="toggle-btn active" onclick="App.switchStatsTab('weekly')">Heti</button>
        <button id="btn-stats-monthly" class="toggle-btn" onclick="App.switchStatsTab('monthly')">Havi</button>
      </div>
      <div class="card chart-card">
        <h3>Elvégzett szokások száma</h3>
        <canvas id="barChart"></canvas>
      </div>
      <div class="card chart-card">
        <h3>Teljesítési arány (%)</h3>
        <canvas id="statsChart"></canvas>
      </div>
    </div>

    <!-- Profile Tab -->
    <div id="view-profile" class="tab-content" style="display: none;">
      <h2>Profil</h2>
      <div class="card">
        <p id="user-email-display"></p>
        <button class="btn-danger" onclick="App.logout()">Kijelentkezés</button>
      </div>
    </div>
  </div>

  <!-- Alsó Navigáció (Bottom Tab Bar) -->
  <nav id="bottom-tab-bar" class="bottom-nav" style="display: none;">
    <button id="tab-home" class="tab-item active" onclick="App.switchTab('home')">Szokások</button>
    <button id="tab-stats" class="tab-item" onclick="App.switchTab('stats')">Statisztika</button>
    <button id="tab-profile" class="tab-item" onclick="App.switchTab('profile')">Profil</button>
  </nav>

  <!-- Szokás Kezelő Modális Ablak (Habit Modal) -->
  <div id="habit-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title">Új szokás</h3>
        <button class="close-btn" onclick="App.closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <!-- Inaktív szokások kiválasztója (Inactivation Dropdown) -->
        <div id="inactive-habits-wrapper" style="display: none; margin-bottom: 15px;">
          <label for="inactive-habits-select">Korábbi inaktív szokás újraaktiválása:</label>
          <select id="inactive-habits-select" onchange="App.handleSelectInactiveHabit(this.value)" style="width: 100%; padding: 10px; border-radius: 6px; background: #1e293b; color: #fff; border: 1px solid #334155; margin-top: 5px;">
            <option value="">-- Válassz a korábbiakból --</option>
          </select>
          <div style="text-align: center; margin: 10px 0; font-size: 12px; color: #94a3b8;">— VAGY hozz létre újat —</div>
        </div>

        <label for="habit-name-input">Szokás neve</label>
        <input type="text" id="habit-name-input" placeholder="pl. Reggeli meditáció" style="width: 100%; margin-bottom: 10px; padding: 10px;" />

        <label for="habit-freq-input">Heti cél (alkalom)</label>
        <input type="number" id="habit-freq-input" placeholder="7" min="1" max="7" style="width: 100%; margin-bottom: 10px; padding: 10px;" />

        <label for="habit-time-input">Időtartam percekben (0 = korlátlan)</label>
        <input type="number" id="habit-time-input" placeholder="0" min="0" style="width: 100%; margin-bottom: 15px; padding: 10px;" />
      </div>
      <div class="modal-footer">
        <button class="btn-primary" onclick="App.saveHabitModal()" style="width: 100%;">Mentés</button>
      </div>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
