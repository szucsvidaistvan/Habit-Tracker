<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Habit Tracker</title>

  <link rel="stylesheet" href="style.css">

  <!-- Supabase JS Client library CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Neon zöld ikon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><defs><linearGradient id='neonGradient' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%2300FF00'/><stop offset='15%25' stop-color='%2300FF00'/><stop offset='35%25' stop-color='%23003300'/><stop offset='65%25' stop-color='%23003300'/><stop offset='85%25' stop-color='%2300FF00'/><stop offset='100%25' stop-color='%2300FF00'/></linearGradient></defs><rect width='512' height='512' rx='100' fill='%23000000'/><circle cx='256' cy='256' r='180' stroke='%23333333' stroke-width='40' fill='none'/><circle cx='256' cy='256' r='180' stroke='url(%23neonGradient)' stroke-width='40' stroke-linecap='round' fill='none' stroke-dasharray='1131' stroke-dashoffset='565' transform='rotate(-90 256 256)'/><path d='M 180 256 L 236 312 L 348 200' stroke='%23FFFFFF' stroke-width='40' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>">
</head>
<body>

<div class="card">
  <div class="header">
    <h1>Habit Tracker</h1>
    <div class="date" id="date-display">Dátum betöltése...</div>
  </div>

  <div id="app-box">
    <div class="progress-box" id="progress-box">
      <div class="progress-info">
        <span class="progress-title">Napi haladás</span>
        <span class="progress-percentage" id="progress-text">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-bar"></div>
      </div>
    </div>

    <div id="content">
      <div class="loader">Mai adatok betöltése...</div>
    </div>

    <!-- Új habit hozzáadása Form -->
    <div style="margin-top: 20px; background: #0f172a; padding: 14px; border-radius: 16px; border: 1px solid var(--border-color);">
      <div style="font-size: 13px; font-weight: bold; margin-bottom: 8px; color: var(--text-main);">➕ Új szokás hozzáadása</div>
      <div style="display: flex; gap: 8px; margin-bottom: 8px;">
        <input type="text" id="new-habit-title" placeholder="Szokás neve (pl. Olvasás)" style="flex: 2; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: #1e293b; color: #fff; font-size: 13px; outline: none;">
        <input type="number" id="new-habit-time" placeholder="Perc (pl. 15)" style="flex: 1; padding: 10px; border-radius: 8px; border: 1px solid var(--border-color); background: #1e293b; color: #fff; font-size: 13px; outline: none;">
      </div>
      <button onclick="addNewHabit()" style="width: 100%; background: #00FF00; color: #000; border: none; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 13px; cursor: pointer;">Hozzáadás</button>
    </div>

    <!-- Részletes Statisztika Gomb és Panel -->
    <button class="details-btn" onclick="toggleAnalytics()">📈 Részletes elemzés / Fejlődési pontok</button>
    <div class="analytics-panel" id="analytics-panel">
      <div class="analytics-title">🎯 Miben kell fejlődnöd?</div>
      <div id="analytics-content">
        <p style="font-size: 12px; color: #64748b;">Kattints a frissítéshez vagy töltsd be az adatokat.</p>
      </div>
    </div>

    <div id="status" style="margin-top: 10px; text-align: center; font-size: 12px;"></div>
  </div>
</div>

<script>
// Supabase Konfiguráció
const SUPABASE_URL = "https://hcnfoywtoegokphjmzpn.supabase.co";
// MÁSOLD BE IDE A TELJES PUBLISHABLE KEY-T A SUPABASE-RŐL:
const SUPABASE_KEY = "sb_publishable_Uzsb3AnDYM5bAwKWI5gwwQ_Hb3fwtNH";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let habitsList = [];
let todayLogs = {};
const todayStr = new Date().toISOString().split('T')[0];

window.onload = function() {
  const now = new Date();
  document.getElementById('date-display').innerText = 'Mai nap: ' +
    String(now.getDate()).padStart(2, '0') + '.' +
    String(now.getMonth() + 1).padStart(2, '0') + '.' +
    now.getFullYear();

  loadData();
};

async function loadData() {
  try {
    // 1. Aktív szokások lekérése
    const { data: habits, error: habitsErr } = await supabase
      .from('habits')
      .select('*')
      .eq('is_active', true)
      .order('id', { ascending: true });

    if (habitsErr) throw habitsErr;
    habitsList = habits;

    // 2. Mai naplózások lekérése
    const { data: logs, error: logsErr } = await supabase
      .from('daily_logs')
      .select('*')
      .eq('log_date', todayStr);

    if (logsErr) throw logsErr;

    todayLogs = {};
    logs.forEach(l => {
      todayLogs[l.habit_id] = l.completed;
    });

    renderHabits();
  } catch (err) {
    console.error("Hiba az adatok betöltésekor:", err);
    document.getElementById('content').innerHTML = '<p style="text-align:center;color:#ef4444;">Hiba az adatok betöltésekor!</p>';
  }
}

function formatTimeLimit(minutes) {
  const num = Number(minutes);
  if (!num || num <= 0) return '';
  if (num >= 60) {
    return `⏱️ ${num / 60} óra`;
  }
  return `⏱️ ${num} perc`;
}

function renderHabits() {
  if (habitsList.length === 0) {
    document.getElementById('content').innerHTML = '<p style="text-align:center;color:#94a3b8;">Még nincsenek aktív szokásaid.</p>';
    updateProgress();
    return;
  }

  let html = '<div class="habit-list">';

  habitsList.forEach(h => {
    const isChecked = todayLogs[h.id] === true;
    const timeStr = formatTimeLimit(h.target_minutes);

    html += `
      <div class="habit-item">
        <div class="habit-info">
          <span class="habit-name">${h.title}</span>
          ${timeStr ? `<span class="habit-time">${timeStr}</span>` : ''}
        </div>
        <div style="display: flex; align-items: center; gap: 12px;">
          <label class="switch">
            <input type="checkbox" id="habit-${h.id}" ${isChecked ? 'checked' : ''} onchange="toggleHabit(${h.id}, this.checked)">
            <span class="slider"></span>
          </label>
          <button onclick="archiveHabit(${h.id})" title="Törlés/Archiválás" style="background: none; border: none; color: #ef4444; font-size: 16px; cursor: pointer; padding: 4px;">🗑️</button>
        </div>
      </div>
    `;
  });

  html += '</div>';
  document.getElementById('content').innerHTML = html;
  updateProgress();
}

function updateProgress() {
  if (habitsList.length === 0) {
    document.getElementById('progress-text').innerText = '0%';
    document.getElementById('progress-bar').style.width = '0%';
    return;
  }

  let checkedCount = 0;
  habitsList.forEach(h => {
    if (todayLogs[h.id] === true) checkedCount++;
  });

  const percent = Math.round((checkedCount / habitsList.length) * 100);
  document.getElementById('progress-text').innerText = percent + '%';
  document.getElementById('progress-bar').style.width = percent + '%';
}

async function toggleHabit(habitId, isCompleted) {
  todayLogs[habitId] = isCompleted;
  updateProgress();

  const statusDiv = document.getElementById('status');
  statusDiv.style.color = '#94a3b8';
  statusDiv.innerText = 'Mentés...';

  const { error } = await supabase
    .from('daily_logs')
    .upsert({
      habit_id: habitId,
      log_date: todayStr,
      completed: isCompleted
    }, { onConflict: 'habit_id,log_date' });

  if (error) {
    console.error("Mentési hiba:", error);
    statusDiv.style.color = '#ef4444';
    statusDiv.innerText = 'Hiba mentéskor!';
  } else {
    statusDiv.style.color = '#00FF00';
    statusDiv.innerText = '✅ Mentve';
    setTimeout(() => { statusDiv.innerText = ''; }, 1500);
  }
}

async function addNewHabit() {
  const titleInput = document.getElementById('new-habit-title');
  const timeInput = document.getElementById('new-habit-time');

  const title = titleInput.value.trim();
  const time = parseInt(timeInput.value) || 0;

  if (!title) {
    alert("Kérlek add meg a szokás nevét!");
    return;
  }

  const { data, error } = await supabase
    .from('habits')
    .insert([{ title: title, target_minutes: time, is_active: true }])
    .select();

  if (error) {
    console.error("Hiba hozzáadáskor:", error);
    alert("Nem sikerült hozzáadni a szokást!");
  } else {
    titleInput.value = '';
    timeInput.value = '';
    loadData();
  }
}

async function archiveHabit(habitId) {
  if (!confirm("Biztosan törölni akarod ezt a szokást? (A korábbi napok statisztikájában megmarad!)")) return;

  const { error } = await supabase
    .from('habits')
    .update({ is_active: false })
    .eq('id', habitId);

  if (error) {
    console.error("Hiba törléskor:", error);
    alert("Nem sikerült törölni a szokást!");
  } else {
    loadData();
  }
}

function toggleAnalytics() {
  const panel = document.getElementById('analytics-panel');
  if (panel.style.display === 'block') {
    panel.style.display = 'none';
  } else {
    panel.style.display = 'block';
    loadAnalytics();
  }
}

function loadAnalytics() {
  const container = document.getElementById('analytics-content');
  const missing = habitsList.filter(h => todayLogs[h.id] !== true);

  if (missing.length === 0) {
    container.innerHTML = '<p style="color: #00FF00; font-size: 13px;">🎉 Fantasztikus! Ma minden szokást teljesítettél!</p>';
  } else {
    let listHtml = '<p style="font-size: 12px; color: #94a3b8; margin-bottom: 8px;">A mai napon még ezekre kell odafigyelned:</p>';
    missing.forEach(h => {
      listHtml += `<div class="weak-habit-item"><span>• ${h.title}</span><span style="color: #ef4444;">Hiányzik</span></div>`;
    });
    container.innerHTML = listHtml;
  }
}
</script>
</body>
</html>
