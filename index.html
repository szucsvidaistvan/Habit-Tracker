<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Habit Tracker</title>
  <link rel="stylesheet" href="style.css?v=1.4">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="card">
    <div class="header">
      <button class="logout-btn" onclick="logout()">🚪</button>
      <h1>Habit Tracker</h1>
      <div class="date" id="current-date">Mai nap: --.--.----</div>
    </div>

    <!-- Nézet 1:Főoldal -->
    <div id="view-home">
      <div class="progress-box">
        <div class="progress-info">
          <span class="progress-title">Napi haladás</span>
          <span class="progress-percentage" id="progress-text">0%</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
      </div>

      <div class="habit-list" id="habits-container">
        <div class="loader">Betöltés...</div>
      </div>

      <button class="open-modal-btn" onclick="openAddModal()">
        <span>+</span> Új szokás hozzáadása
      </button>
    </div>

    <!-- Nézet 2: Statisztika -->
    <div id="view-stats" style="display: none;">
      <div class="stats-switcher">
        <button class="stats-tab-btn active" onclick="switchStatsTab('weekly')">Heti</button>
        <button class="stats-tab-btn" onclick="switchStatsTab('monthly')">Havi</button>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value" id="stat-completed-count">0</div>
          <div class="stat-label">Teljesítve</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-rate">0%</div>
          <div class="stat-label">Sikeresség</div>
        </div>
      </div>

      <div id="stats-bars-container"></div>
    </div>

    <!-- Nézet 3: Profil -->
    <div id="view-profile" style="display: none;" class="profile-container">
      <h3>Profil beállítások</h3>
      <p id="user-email-display" style="color: var(--text-sub); font-size: 13px;"></p>
    </div>

    <div id="status"></div>
  </div>

  <!-- Modal: Hozzáadás / Szerkesztés -->
  <div class="modal-overlay" id="habit-modal">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title" id="modal-title-text">Új szokás</span>
        <button class="close-modal-btn" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-inputs">
        <input type="text" id="habit-name-input" placeholder="Szokás neve (pl. Edzés)">
        <input type="text" id="habit-freq-input" placeholder="Gyakoriság (pl. Heti 4x)">
      </div>
      <button class="modal-submit-btn" onclick="saveHabitModal()">Mentés</button>
    </div>
  </div>

  <!-- iOS Bottom Tab Bar -->
  <div class="ios-tab-bar">
    <button class="tab-item active" onclick="switchTab('home')" id="tab-home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
      </svg>
      <span class="tab-label">Főoldal</span>
    </button>
    <button class="tab-item" onclick="switchTab('stats')" id="tab-stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="20" x2="18" y2="10"></line>
        <line x1="12" y1="20" x2="12" y2="4"></line>
        <line x1="6" y1="20" x2="6" y2="14"></line>
      </svg>
      <span class="tab-label">Statisztika</span>
    </button>
    <button class="tab-item" onclick="switchTab('profile')" id="tab-profile">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
        <circle cx="12" cy="7" r="4"></circle>
      </svg>
      <span class="tab-label">Profil</span>
    </button>
  </div>

  <script>
    const SUPABASE_URL = 'https://wvhvuvkscqikwzwbwnqg.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind2aHZ1dmtzY3Fpa3d6d2J3bnFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDEyMzQ1NjcsImV4cCI6MjA1NjgxMDU2N30.placeholder_key';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let habitsList = [];
    let editingHabitId = null;

    document.addEventListener('DOMContentLoaded', async () => {
      const today = new Date().toLocaleDateString('hu-HU');
      document.getElementById('current-date').innerText = `Mai nap: ${today}`;

      const { data: { session } } = await db.auth.getSession();
      if (!session) {
        window.location.href = 'login.html';
      } else {
        currentUser = session.user;
        document.getElementById('user-email-display').innerText = `Bejelentkezve: ${currentUser.email}`;
        await fetchHabits();
      }
    });

    async function fetchHabits() {
      if (!currentUser) return;

      const { data, error } = await db
        .from('habits')
        .select('*')
        .eq('user_id', currentUser.id)
        .order('created_at', { ascending: true });

      if (error) {
        console.error('Hiba az adatok lekérésénél:', error);
        document.getElementById('habits-container').innerHTML = '<div class="loader">Hiba történt a betöltéskor.</div>';
        return;
      }

      habitsList = data || [];
      renderHabits();
    }

    function renderHabits() {
      const container = document.getElementById('habits-container');
      if (!container) return;

      if (habitsList.length === 0) {
        container.innerHTML = '<div class="loader">Még nincsenek felvett szokások.</div>';
        updateProgress();
        return;
      }

      container.innerHTML = habitsList.map(h => `
        <div class="habit-card-wrapper">
          <div class="swipe-actions">
            <button class="swipe-btn edit" onclick="openEditModal('${h.id}')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
              </svg>
            </button>
            <button class="swipe-btn delete" onclick="deleteHabit('${h.id}')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              </svg>
            </button>
          </div>

          <div class="habit-item" id="swipe-content-${h.id}">
            <div class="habit-info">
              <span class="habit-name">${h.name}</span>
              <span class="habit-time">${h.frequency || ''}</span>
            </div>
            <div id="switch-wrapper-${h.id}">
              <label class="switch">
                <input type="checkbox" ${h.completed ? 'checked' : ''} onchange="toggleHabit('${h.id}', ${h.completed})">
                <span class="slider"></span>
              </label>
            </div>
          </div>
        </div>
      `).join('');

      updateProgress();
      initSwipeEvents();
    }

    function initSwipeEvents() {
      habitsList.forEach(h => {
        const card = document.getElementById(`swipe-content-${h.id}`);
        const switchElem = document.getElementById(`switch-wrapper-${h.id}`);
        if (!card) return;

        if (switchElem) {
          ['touchstart', 'touchmove', 'touchend'].forEach(evtType => {
            switchElem.addEventListener(evtType, (e) => e.stopPropagation(), { passive: true });
          });
        }

        let startX = 0;
        let currentX = 0;
        let isOpen = false;

        card.addEventListener('touchstart', (e) => {
          startX = e.touches[0].clientX;
          currentX = startX;
          card.style.transition = 'none';
        }, { passive: true });

        card.addEventListener('touchmove', (e) => {
          currentX = e.touches[0].clientX;
          let diffX = currentX - startX;

          if (isOpen) {
            let newX = -110 + diffX;
            if (newX > 0) newX = 0;
            if (newX < -110) newX = -110;
            card.style.transform = `translateX(${newX}px)`;
          } else {
            if (diffX < 0 && diffX > -130) {
              card.style.transform = `translateX(${diffX}px)`;
            }
          }
        }, { passive: true });

        card.addEventListener('touchend', () => {
          card.style.transition = 'transform 0.2s ease-out';
          const diffX = currentX - startX;

          if (!isOpen) {
            if (diffX < -50) {
              card.style.transform = 'translateX(-110px)';
              isOpen = true;
            } else {
              card.style.transform = 'translateX(0px)';
            }
          } else {
            if (diffX > 30) {
              card.style.transform = 'translateX(0px)';
              isOpen = false;
            } else {
              card.style.transform = 'translateX(-110px)';
            }
          }
        });
      });
    }

    async function toggleHabit(id, currentStatus) {
      const newStatus = !currentStatus;
      const item = habitsList.find(h => h.id === id);
      if (item) item.completed = newStatus;
      updateProgress();

      const { error } = await db
        .from('habits')
        .update({ completed: newStatus })
        .eq('id', id);

      if (error) {
        console.error('Hiba a frissítéskor:', error);
        await fetchHabits();
      }
    }

    async function saveHabitModal() {
      const name = document.getElementById('habit-name-input').value.trim();
      const freq = document.getElementById('habit-freq-input').value.trim();
      if (!name || !currentUser) return;

      if (editingHabitId) {
        const { error } = await db
          .from('habits')
          .update({ name: name, frequency: freq })
          .eq('id', editingHabitId);

        if (error) console.error('Szerkesztési hiba:', error);
      } else {
        const { error } = await db
          .from('habits')
          .insert([{
            user_id: currentUser.id,
            name: name,
            frequency: freq || 'Heti 7x',
            completed: false
          }]);

        if (error) console.error('Hozzáadási hiba:', error);
      }

      closeModal();
      await fetchHabits();
    }

    async function deleteHabit(id) {
      const { error } = await db
        .from('habits')
        .delete()
        .eq('id', id);

      if (error) {
        console.error('Törlési hiba:', error);
      } else {
        await fetchHabits();
      }
    }

    function updateProgress() {
      const completed = habitsList.filter(h => h.completed).length;
      const total = habitsList.length;
      const percent = total > 0 ? Math.round((completed / total) * 100) : 0;
      
      document.getElementById('progress-text').innerText = `${percent}%`;
      document.getElementById('progress-fill').style.width = `${percent}%`;
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-item').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`tab-${tab}`).classList.add('active');

      document.getElementById('view-home').style.display = tab === 'home' ? 'block' : 'none';
      document.getElementById('view-stats').style.display = tab === 'stats' ? 'block' : 'none';
      document.getElementById('view-profile').style.display = tab === 'profile' ? 'block' : 'none';
    }

    function openAddModal() {
      editingHabitId = null;
      document.getElementById('modal-title-text').innerText = 'Új szokás';
      document.getElementById('habit-name-input').value = '';
      document.getElementById('habit-freq-input').value = '';
      document.getElementById('habit-modal').classList.add('active');
    }

    function openEditModal(id) {
      const h = habitsList.find(item => item.id === id);
      if (!h) return;
      editingHabitId = id;
      document.getElementById('modal-title-text').innerText = 'Szokás szerkesztése';
      document.getElementById('habit-name-input').value = h.name;
      document.getElementById('habit-freq-input').value = h.frequency || '';
      document.getElementById('habit-modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('habit-modal').classList.remove('active');
    }

    async function logout() {
      await db.auth.signOut();
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
