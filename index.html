<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Habit Tracker</title>

  <link rel="stylesheet" href="style.css">

  <!-- Supabase JS Client SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Chart.js a vizuális diagramokhoz -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Neon zöld ikon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><defs><linearGradient id='neonGradient' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%2300FF00'/><stop offset='15%25' stop-color='%2300FF00'/><stop offset='35%25' stop-color='%23003300'/><stop offset='65%25' stop-color='%23003300'/><stop offset='85%25' stop-color='%2300FF00'/><stop offset='100%25' stop-color='%2300FF00'/></linearGradient></defs><rect width='512' height='512' rx='100' fill='%23000000'/><circle cx='256' cy='256' r='180' stroke='%23333333' stroke-width='40' fill='none'/><circle cx='256' cy='256' r='180' stroke='url(%23neonGradient)' stroke-width='40' stroke-linecap='round' fill='none' stroke-dasharray='1131' stroke-dashoffset='565' transform='rotate(-90 256 256)'/><path d='M 180 256 L 236 312 L 348 200' stroke='%23FFFFFF' stroke-width='40' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>">
</head>
<body>

<!-- BEJELENTKEZŐ FELÜLET -->
<div class="card" id="auth-card">
  <div class="header">
    <h1>Habit Tracker</h1>
    <div class="date">Bejelentkezés</div>
  </div>
  <div class="modal-inputs">
    <input type="email" id="auth-email" placeholder="E-mail cím">
    <input type="password" id="auth-password" placeholder="Jelszó">
  </div>
  <button class="modal-submit-btn" onclick="login()" style="margin-bottom: 8px;">Bejelentkezés</button>
  <button class="details-btn" onclick="register()">Regisztráció új fiókkal</button>
  <div id="auth-status" style="margin-top: 10px; font-size: 12px; text-align: center;"></div>
</div>

<!-- FŐ ALKALMAZÁS PANELS -->
<div class="card" id="app-card" style="display: none;">
  
  <!-- TAB 1: FŐOLDAL (HABITS) -->
  <div id="tab-home" class="tab-content">
    <div class="header">
      <h1>Habit Tracker</h1>
      <div class="date" id="date-display">Dátum betöltése...</div>
    </div>

    <div class="progress-box" id="progress-box">
      <div class="progress-info">
        <span class="progress-title">Napi haladás</span>
        <span class="progress-percentage" id="progress-text">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-bar"></div>
      </div>
    </div>

    <div id="content">
      <div class="loader">Mai adatok betöltése...</div>
    </div>

    <button class="open-modal-btn" onclick="openModal()" style="margin-top: 15px;">➕ Új szokás hozzáadása</button>
    <div id="status" style="text-align: center; font-size: 12px; margin-top: 8px;"></div>
  </div>

  <!-- TAB 2: STATISZTIKA (ANALYTICS) -->
  <div id="tab-stats" class="tab-content" style="display: none;">
    <div class="header">
      <h1>Statisztika</h1>
      <div class="date">Fejlődés és Elemzés</div>
    </div>

    <div class="stats-switcher">
      <button class="stats-tab-btn active" id="btn-period-week" onclick="switchStatsPeriod('week')">📅 Utolsó 7 nap</button>
      <button class="stats-tab-btn" id="btn-period-month" onclick="switchStatsPeriod('month')">🗓️ Utolsó 30 nap</button>
    </div>

    <div class="stats-grid" style="margin-top: 12px;">
      <div class="stat-card">
        <div class="stat-value" id="stat-total-percent">0%</div>
        <div class="stat-label">Célok teljesülése</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-weakest-title" style="font-size: 13px; font-weight:600; color: #ef4444; margin-top: 3px;">-</div>
        <div class="stat-label">Fejlesztendő terület</div>
      </div>
    </div>

    <div style="margin-top: 20px; background: rgba(0,0,0,0.2); padding: 12px; border-radius: 12px;">
      <canvas id="statsChart" width="400" height="250"></canvas>
    </div>
  </div>

  <!-- TAB 3: PROFIL (PROFILE) -->
  <div id="tab-profile" class="tab-content" style="display: none;">
    <div class="header">
      <h1>Profil</h1>
      <div class="date">Fiókbeállítások</div>
    </div>

    <div style="background: rgba(255,255,255,0.03); padding: 16px; border-radius: 12px; border: 1px solid var(--border-color); margin-top: 15px;">
      <p style="font-size: 12px; color: var(--text-sub); margin-bottom: 4px;">Bejelentkezve mint:</p>
      <p id="user-email-display" style="font-weight: 600; font-size: 15px; color: var(--text-main); margin-bottom: 20px;"></p>
      
      <button class="delete-single-btn" onclick="logout()" style="width: 100%; padding: 12px; font-weight: 600;">🚪 Kijelentkezés</button>
    </div>
  </div>

</div>

<!-- iOS STYLE BOTTOM TAB BAR NAVIGÁCIÓ -->
<div class="ios-tab-bar" id="ios-nav" style="display: none;">
  <button class="tab-item active" onclick="switchTab('home')" id="nav-home">
    <span class="tab-icon">🏠</span>
    <span class="tab-label">Főoldal</span>
  </button>
  <button class="tab-item" onclick="switchTab('stats')" id="nav-stats">
    <span class="tab-icon">📊</span>
    <span class="tab-label">Statisztika</span>
  </button>
  <button class="tab-item" onclick="switchTab('profile')" id="nav-profile">
    <span class="tab-icon">👤</span>
    <span class="tab-label">Profil</span>
  </button>
</div>

<!-- Modal szokás létrehozásához és szerkesztéséhez -->
<div class="modal-overlay" id="habit-modal">
  <div class="modal-content">
    <div class="modal-header">
      <span class="modal-title" id="modal-title-text">➕ Új szokás felvétele</span>
      <button class="close-modal-btn" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-inputs">
      <input type="hidden" id="edit-habit-id">
      <div>
        <label style="font-size: 11px; color: var(--text-sub);">Szokás neve:</label>
        <input type="text" id="new-habit-title" placeholder="pl. Workout">
      </div>
      <div>
        <label style="font-size: 11px; color: var(--text-sub);">Cél idő percben (0 ha nincs):</label>
        <input type="number" id="new-habit-time" placeholder="pl. 60">
      </div>
      <div>
        <label style="font-size: 11px; color: var(--text-sub);">Heti cél (hány nap egy héten):</label>
        <input type="number" id="new-habit-weekly" placeholder="1 - 7 nap" min="1" max="7" value="7">
      </div>
    </div>
    <button class="modal-submit-btn" id="modal-save-btn" onclick="saveHabit()">Mentés</button>
  </div>
</div>

<script>
const SUPABASE_URL = "https://hcnfoywtoegokphjmzpn.supabase.co";
const SUPABASE_KEY = "sb_publishable_Uzsb3AnDYM5bAwKWI5gwwQ_Hb3fwtNH";

const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let habitsList = [];
let todayLogs = {};
let currentStatsPeriod = 'week';
let currentUser = null;
let chartInstance = null;
const todayStr = new Date().toISOString().split('T')[0];

window.onload = async function() {
  const { data: { session } } = await sbClient.auth.getSession();
  if (session) {
    currentUser = session.user;
    showApp();
  } else {
    showAuth();
  }
};

function showAuth() {
  document.getElementById('auth-card').style.display = 'block';
  document.getElementById('app-card').style.display = 'none';
  document.getElementById('ios-nav').style.display = 'none';
}

function showApp() {
  document.getElementById('auth-card').style.display = 'none';
  document.getElementById('app-card').style.display = 'block';
  document.getElementById('ios-nav').style.display = 'flex';
  document.getElementById('user-email-display').innerText = currentUser.email;

  const now = new Date();
  document.getElementById('date-display').innerText = 'Mai nap: ' +
    String(now.getDate()).padStart(2, '0') + '.' +
    String(now.getMonth() + 1).padStart(2, '0') + '.' +
    now.getFullYear();

  loadData();
}

function switchTab(tabName) {
  document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
  document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));

  document.getElementById('tab-' + tabName).style.display = 'block';
  document.getElementById('nav-' + tabName).classList.add('active');

  if (tabName === 'stats') {
    loadAnalytics(currentStatsPeriod);
  }
}

async function login() {
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value.trim();
  const status = document.getElementById('auth-status');

  if (!email || !password) {
    status.style.color = '#ef4444';
    status.innerText = 'Kérlek töltsd ki mindkét mezőt!';
    return;
  }

  const { data, error } = await sbClient.auth.signInWithPassword({ email, password });
  if (error) {
    status.style.color = '#ef4444';
    status.innerText = 'Hiba: ' + error.message;
  } else {
    currentUser = data.user;
    showApp();
  }
}

async function register() {
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value.trim();
  const status = document.getElementById('auth-status');

  if (!email || !password) {
    status.style.color = '#ef4444';
    status.innerText = 'Kérlek töltsd ki mindkét mezőt!';
    return;
  }

  const { data, error } = await sbClient.auth.signUp({ email, password });
  if (error) {
    status.style.color = '#ef4444';
    status.innerText = 'Hiba: ' + error.message;
  } else {
    status.style.color = '#00FF00';
    status.innerText = 'Sikeres regisztráció! Lépj be.';
  }
}

async function logout() {
  await sbClient.auth.signOut();
  currentUser = null;
  showAuth();
}

async function loadData() {
  try {
    const { data: habits, error: habitsErr } = await sbClient
      .from('habits')
      .select('*')
      .eq('is_active', true)
      .order('id', { ascending: true });

    if (habitsErr) throw habitsErr;
    habitsList = habits || [];

    const { data: logs, error: logsErr } = await sbClient
      .from('daily_logs')
      .select('*')
      .eq('log_date', todayStr);

    if (logsErr) throw logsErr;

    todayLogs = {};
    if (logs) {
      logs.forEach(l => {
        todayLogs[l.habit_id] = l.completed;
      });
    }

    renderHabits();
  } catch (err) {
    console.error("Hiba az adatok betöltésekor:", err);
    document.getElementById('content').innerHTML = '<p style="text-align:center;color:#ef4444;">Hiba az adatok betöltésekor!</p>';
  }
}

function formatTimeLimit(minutes) {
  const num = Number(minutes);
  if (!num || num <= 0) return '';
  if (num >= 60) return `⏱️ ${num / 60} óra`;
  return `⏱️ ${num} perc`;
}

function renderHabits() {
  if (habitsList.length === 0) {
    document.getElementById('content').innerHTML = '<p style="text-align:center;color:var(--text-sub); margin-top:20px;">Még nincsenek aktív szokásaid.</p>';
    updateProgress();
    return;
  }

  let html = '<div class="habit-list">';

  habitsList.forEach(h => {
    const isChecked = todayLogs[h.id] === true;
    const timeStr = formatTimeLimit(h.target_minutes);
    const weeklyTarget = h.weekly_target || 7;

    html += `
      <div class="swipe-container" id="swipe-container-${h.id}">
        <div class="swipe-actions">
          <button class="swipe-btn edit" onclick="openModal(${h.id})">✏️</button>
          <button class="swipe-btn delete" onclick="archiveHabit(${h.id})">🗑️</button>
        </div>
        <div class="habit-item swipe-content" id="swipe-content-${h.id}">
          <div class="habit-info">
            <span class="habit-name">${h.title}</span>
            <span class="habit-time">Heti ${weeklyTarget}x ${timeStr ? '• ' + timeStr : ''}</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="habit-${h.id}" ${isChecked ? 'checked' : ''} onchange="toggleHabit(${h.id}, this.checked)">
            <span class="slider"></span>
          </label>
        </div>
      </div>
    `;
  });

  html += '</div>';
  document.getElementById('content').innerHTML = html;
  updateProgress();
  initSwipeEvents();
}

/* iOS SWIPE TO DELETE / EDIT LOGIKA */
function initSwipeEvents() {
  habitsList.forEach(h => {
    const card = document.getElementById(`swipe-content-${h.id}`);
    if (!card) return;

    let startX = 0;
    let currentX = 0;

    card.addEventListener('touchstart', (e) => {
      startX = e.touches[0].clientX;
    });

    card.addEventListener('touchmove', (e) => {
      currentX = e.touches[0].clientX;
      const diffX = currentX - startX;
      if (diffX < 0 && diffX > -120) {
        card.style.transform = `translateX(${diffX}px)`;
      }
    });

    card.addEventListener('touchend', (e) => {
      const diffX = currentX - startX;
      if (diffX < -50) {
        card.style.transform = 'translateX(-110px)';
      } else {
        card.style.transform = 'translateX(0px)';
      }
    });
  });
}

function updateProgress() {
  if (habitsList.length === 0) {
    document.getElementById('progress-text').innerText = '0%';
    document.getElementById('progress-bar').style.width = '0%';
    return;
  }

  let checkedCount = 0;
  habitsList.forEach(h => {
    if (todayLogs[h.id] === true) checkedCount++;
  });

  const percent = Math.round((checkedCount / habitsList.length) * 100);
  document.getElementById('progress-text').innerText = percent + '%';
  document.getElementById('progress-bar').style.width = percent + '%';
}

async function toggleHabit(habitId, isCompleted) {
  todayLogs[habitId] = isCompleted;
  updateProgress();

  const statusDiv = document.getElementById('status');
  statusDiv.style.color = 'var(--text-sub)';
  statusDiv.innerText = 'Mentés...';

  const { error } = await sbClient
    .from('daily_logs')
    .upsert({
      habit_id: habitId,
      log_date: todayStr,
      completed: isCompleted
    }, { onConflict: 'habit_id,log_date' });

  if (error) {
    statusDiv.style.color = '#ef4444';
    statusDiv.innerText = 'Hiba mentéskor!';
  } else {
    statusDiv.style.color = '#00FF00';
    statusDiv.innerText = '✅ Mentve';
    setTimeout(() => { statusDiv.innerText = ''; }, 1500);
  }
}

function openModal(habitId = null) {
  if (habitId) {
    const habit = habitsList.find(h => h.id === habitId);
    document.getElementById('edit-habit-id').value = habit.id;
    document.getElementById('new-habit-title').value = habit.title;
    document.getElementById('new-habit-time').value = habit.target_minutes || 0;
    document.getElementById('new-habit-weekly').value = habit.weekly_target || 7;
    document.getElementById('modal-title-text').innerText = '✏️ Szokás szerkesztése';

    // Kártya visszaállítása eredeti helyére szerkesztéskor
    const card = document.getElementById(`swipe-content-${habitId}`);
    if (card) card.style.transform = 'translateX(0px)';
  } else {
    document.getElementById('edit-habit-id').value = '';
    document.getElementById('new-habit-title').value = '';
    document.getElementById('new-habit-time').value = '';
    document.getElementById('new-habit-weekly').value = '7';
    document.getElementById('modal-title-text').innerText = '➕ Új szokás felvétele';
  }
  document.getElementById('habit-modal').classList.add('active');
}

function closeModal() {
  document.getElementById('habit-modal').classList.remove('active');
}

async function saveHabit() {
  const habitId = document.getElementById('edit-habit-id').value;
  const title = document.getElementById('new-habit-title').value.trim();
  const time = parseInt(document.getElementById('new-habit-time').value) || 0;
  const weekly = parseInt(document.getElementById('new-habit-weekly').value) || 7;

  if (!title) {
    alert("Kérlek add meg a szokás nevét!");
    return;
  }

  if (habitId) {
    await sbClient
      .from('habits')
      .update({ title: title, target_minutes: time, weekly_target: weekly })
      .eq('id', habitId);
  } else {
    await sbClient
      .from('habits')
      .insert([{ title: title, target_minutes: time, weekly_target: weekly, user_id: currentUser.id, is_active: true }]);
  }

  closeModal();
  loadData();
}

async function archiveHabit(habitId) {
  if (!confirm("Biztosan törölni akarod ezt a szokást?")) return;

  await sbClient
    .from('habits')
    .update({ is_active: false })
    .eq('id', habitId);

  loadData();
}

function switchStatsPeriod(period) {
  currentStatsPeriod = period;
  document.getElementById('btn-period-week').classList.toggle('active', period === 'week');
  document.getElementById('btn-period-month').classList.toggle('active', period === 'month');
  loadAnalytics(period);
}

async function loadAnalytics(period) {
  const daysCount = period === 'week' ? 7 : 30;
  const startDate = new Date();
  startDate.setDate(startDate.getDate() - (daysCount - 1));
  const startDateStr = startDate.toISOString().split('T')[0];

  try {
    const { data: logs } = await sbClient
      .from('daily_logs')
      .select('*')
      .gte('log_date', startDateStr);

    if (!habitsList || habitsList.length === 0) return;

    let totalTargetDays = 0;
    let totalCompletedDays = 0;
    const labels = [];
    const dataPercents = [];

    let weakest = null;
    let minPercent = 101;

    habitsList.forEach(h => {
      const hLogs = (logs || []).filter(l => l.habit_id === h.id && l.completed === true);
      const weeklyTarget = h.weekly_target || 7;
      const targetForPeriod = period === 'week' ? weeklyTarget : Math.round((weeklyTarget / 7) * 30);
      const completedCount = hLogs.length;
      const percent = Math.min(Math.round((completedCount / targetForPeriod) * 100), 100);

      totalTargetDays += targetForPeriod;
      totalCompletedDays += Math.min(completedCount, targetForPeriod);

      labels.push(h.title);
      dataPercents.push(percent);

      if (percent < minPercent) {
        minPercent = percent;
        weakest = h.title;
      }
    });

    const totalPercent = totalTargetDays > 0 ? Math.round((totalCompletedDays / totalTargetDays) * 100) : 0;
    
    document.getElementById('stat-total-percent').innerText = totalPercent + '%';
    document.getElementById('stat-weakest-title').innerText = weakest || '-';

    renderChart(labels, dataPercents);

  } catch (err) {
    console.error("Statisztikai hiba:", err);
  }
}

function renderChart(labels, dataPercents) {
  const ctx = document.getElementById('statsChart').getContext('2d');

  if (chartInstance) {
    chartInstance.destroy();
  }

  chartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{
        label: 'Cél teljesülése (%)',
        data: dataPercents,
        backgroundColor: '#00FF00',
        borderRadius: 6
      }]
    },
    options: {
      responsive: true,
      scales: {
        y: {
          beginAtZero: true,
          max: 100,
          ticks: { color: '#94a3b8' },
          grid: { color: 'rgba(255,255,255,0.05)' }
        },
        x: {
          ticks: { color: '#94a3b8', font: { size: 10 } },
          grid: { display: false }
        }
      },
      plugins: {
        legend: { display: false }
      }
    }
  });
}
</script>
</body>
</html>
